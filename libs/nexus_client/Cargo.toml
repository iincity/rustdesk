[package]
name = "nexus_client"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[dependencies]
aes-gcm = "0.10"
getrandom = "0.2"
hex = "0.4"
tokio = { version = "1.44", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[lib]
path = "src/lib.rs"
